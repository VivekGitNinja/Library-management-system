# ========================================================
# Database Configuration Properties
# ========================================================

# Database Type: mysql or h2 (h2 as fallback for local embedded execution without server setup)
db.type=mysql

# MySQL Settings
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/library_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
db.username=root
db.password=root

# H2 Fallback Settings (Used automatically if MySQL server is unreachable)
h2.driver=org.h2.Driver
h2.url=jdbc:h2:mem:library_db;DB_CLOSE_DELAY=-1;MODE=MySQL
h2.username=sa
h2.password=

# Connection Pool Settings
pool.maximumPoolSize=10
pool.minimumIdle=2
pool.idleTimeout=30000
pool.connectionTimeout=10000
pool.maxLifetime=1800000
